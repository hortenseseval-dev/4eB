<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>4eB Chapter 1 · Welcome back to school</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;700&display=swap">
<style>
/* Layout: projected classroom deck. Home = chapter map by part. Lesson = top bar (step + timer), centre slide, house points bar.
   Single dark "night sky" theme for projection. Grammar colours: c1 teal, c2 coral, c3 gold, c4 violet. */
:root{
  --bg:#121829; --panel:#1b2340; --panel2:#243057; --line:#34406b;
  --fg:#f2ecdf; --muted:#a9b0c9; --accent:#ffc94a;
  --c1:#46d3c3; --c2:#ff7d5c; --c3:#ffc94a; --c4:#b79cff; --ok:#5fd18a; --bad:#ff6b6b;
  --g:#d0473a; --s:#2f9a62; --h:#e8b820; --r:#4677e0;
  --p1:#46d3c3; --p2:#ff7d5c; --p3:#b79cff;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Lexend","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:clamp(15px,1.15vw + 8px,22px);line-height:1.4;display:flex;flex-direction:column;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top,.slides,.houses{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
.step{font-family:var(--display);font-weight:800;display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.step small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:.65em;text-transform:uppercase;letter-spacing:.08em}
.timer{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.timer b{font-family:var(--display);font-size:1.5em;font-variant-numeric:tabular-nums;min-width:3.3ch;text-align:center}
.timer.end{background:var(--bad);animation:pulse .6s 4}
.timer.run b{color:var(--accent)}
.ib{border:0;background:var(--panel2);border-radius:999px;width:2.2em;height:2.2em;display:grid;place-items:center;font-size:.9em;flex:none}
.ib:hover{background:var(--line)}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:12px;height:12px;border-radius:50%;border:0;background:var(--line);padding:0}
.dots button.on{background:var(--accent)}
.slides{flex:1;min-height:0;overflow-y:auto;padding-block:18px}
.slide{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(2.2rem,5vw,4.2rem)}
h2{font-size:clamp(1.7rem,3.4vw,3rem)}
h3{font-size:1.25em}
.lead{color:var(--muted);margin:0;max-width:62ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.big{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.6vw,3rem);line-height:1.15}
.say{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.say:hover{border-color:var(--accent)}
.spk{flex:none;width:2.2em;height:2.2em;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-size:.85em}
.pic{font-size:2.4em;line-height:1}
.c1{color:var(--c1)} .c2{color:var(--c2)} .c3{color:var(--c3)} .c4{color:var(--c4)}
.strike{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px;opacity:.85}
.tag{display:inline-block;font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:.6em 1.1em;background:var(--accent);color:var(--bg);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:.4em}
.btn.ghost{background:var(--panel2);color:var(--fg)}
.btn.okb{background:var(--ok);color:#0c2416} .btn.badb{background:var(--bad);color:#2a0b0b}
.btn.sm{padding:.3em .8em;font-size:.8em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
.counter{color:var(--muted);text-align:center;margin:0}
.bigq{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4.4vw,3.6rem);text-align:center;padding:24px 10px;line-height:1.15}
.verdict{text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,3.2rem)}
.verdict.t{color:var(--ok)} .verdict.f{color:var(--bad)}
.warn{background:var(--panel2);border-radius:12px;padding:12px 16px}
.field{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%}
/* home */
.home{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.parts{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.part{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--pc);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.part h3 span{color:var(--pc)}
.lbtn{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--panel2);border:1px solid transparent;border-radius:12px;padding:10px 12px}
.lbtn:hover{border-color:var(--pc)}
.lbtn .num{flex:none;width:2em;height:2em;border-radius:50%;background:var(--pc);color:var(--bg);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.lbtn small{display:block;color:var(--muted);font-size:.78em}
.lbtn.last{border-color:var(--accent)}
.taskband{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel2);border-radius:14px;padding:12px 16px}
/* rule */
.rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.rule .card{border-width:3px}
.rule .b1{border-color:var(--c1)} .rule .b2{border-color:var(--c2)} .rule .b3{border-color:var(--c3)} .rule .b4{border-color:var(--c4)}
.chant{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.chant div{background:var(--panel);border-radius:10px;padding:10px 14px;font-size:1.25em;font-weight:700;transition:transform .15s,background .15s}
.chant div.on{background:var(--panel2);transform:scale(1.06)}
.chant div.on.hit{background:var(--c2);color:var(--bg)}
.chant div.on.hit span{color:var(--bg)}
/* vocab */
.vgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.vcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 8px;min-height:7em}
.vcard:hover{border-color:var(--accent)}
.vcard.hi{border-color:var(--accent);background:var(--panel2);transform:scale(1.04)}
.vcard .pic{font-size:2.6em}
.vcard .w{font-weight:700}
.vcard .w.hid{visibility:hidden}
/* simon */
.simon{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px}
.simon .pic{font-size:clamp(4rem,12vw,8rem)}
/* slates & noughts */
.blank{display:inline-block;min-width:4.5em;border-bottom:4px solid var(--accent);padding:0 .2em}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:760px;width:100%;margin:0 auto}
.ttt button{aspect-ratio:1.45;max-width:100%;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-weight:700;padding:8px;font-size:.92em;line-height:1.25}
.ttt button:hover{border-color:var(--accent)}
.ttt button.X,.ttt button.O{font-family:var(--display);font-size:clamp(2rem,6vw,4rem)}
.modal{position:fixed;inset:0;background:rgba(8,10,20,.84);display:grid;place-items:center;padding:20px;z-index:20}
.modal .card{max-width:820px;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px;padding:28px}
/* sort */
.cats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.cats button{font-size:1.3em;font-weight:700;padding:18px;border-radius:14px;border:3px solid var(--line);background:var(--panel)}
.cats button:hover{border-color:var(--accent)}
.cats button.right{border-color:var(--ok);background:var(--ok);color:#0c2416}
.cats button.wrong{border-color:var(--bad);color:var(--bad)}
/* video timeline */
.tl{display:grid;gap:8px}
.tl .say b{font-family:var(--display);color:var(--accent);min-width:3.2em;display:inline-block;font-variant-numeric:tabular-nums}
.tl.hide .txt{filter:blur(8px)}
/* task */
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:12px;padding:12px 16px;font-size:1.15em}
.steps li::before{content:counter(s);flex:none;width:2em;height:2em;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.checks{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.checks button{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.checks button.on{border-color:var(--ok);color:var(--ok)}
/* charter */
.rules{display:grid;gap:8px}
.rules .r{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:8px 12px}
.rules .r .t{flex:1;min-width:0;font-weight:700}
.rules .r b{font-family:var(--display);font-size:1.4em;color:var(--accent);min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.final{background:#f6f1e3;color:#1b2340;border-radius:8px;padding:26px 30px;display:flex;flex-direction:column;gap:10px}
.final h2{color:#1b2340;text-align:center}
.final p{margin:0;font-size:1.35em;font-weight:700}
/* copy */
.copy{background:#f6f1e3;color:#1b2340;border-radius:6px;padding:22px 26px;font-size:1.2em;line-height:1.9;background-image:repeating-linear-gradient(transparent 0 calc(1.9em - 1px),#b9c3dd calc(1.9em - 1px) 1.9em);background-position:0 18px;overflow-wrap:anywhere}
.copy .c1{color:#0d8577} .copy .c2{color:#c4452a} .copy .c3{color:#9a6a00} .copy .c4{color:#6a46c9}
.copy p{margin:0}
/* HP */
.phases{display:flex;gap:8px;flex-wrap:wrap}
.phases button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.4em 1em}
.phases button.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.hpgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.hp select,.hp input{width:100%}
.wc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px}
.wc button{border:0;border-radius:12px;padding:10px;font-weight:700;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.wc button b{font-family:var(--display);font-size:1.8em;line-height:1;font-variant-numeric:tabular-nums}
.book{display:flex;flex-wrap:wrap;gap:8px;max-height:16em;overflow-y:auto}
.book button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:.3em .9em}
.book button small{color:var(--muted)}
/* houses */
.houses{border-top:1px solid var(--line);padding-block:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:stretch;background:var(--bg);padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.house{display:flex;align-items:center;gap:6px;border-radius:12px;padding:4px 6px 4px 12px;color:#fff;min-width:0}
.house .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85em}
.house .sc{font-family:var(--display);font-weight:800;font-size:1.6em;font-variant-numeric:tabular-nums}
.house .pm{border:0;background:rgba(0,0,0,.28);color:#fff;border-radius:8px;width:1.9em;height:1.9em;font-weight:700}
.house.bump{animation:bump .5s}
.hG{background:var(--g)} .hS{background:var(--s)} .hH{background:var(--h);color:#241a00} .hH .pm{color:#241a00;background:rgba(0,0,0,.14)} .hR{background:var(--r)}
.sync{font-size:.7em;color:var(--muted);align-self:center;text-align:right}
.cup{display:grid;gap:8px}
.cup div{display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:10px 16px;color:#fff;font-weight:700;font-size:1.2em}
.cup .hH{color:#241a00}
@media (max-width:700px){.houses{grid-template-columns:repeat(2,minmax(0,1fr))}.sync{grid-column:1/-1;text-align:center}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes bump{40%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    <button class="ib" id="next" aria-label="Next slide">→</button>
  </div>
</header>
<main class="slides" id="stage"></main>
<footer class="houses" id="houses"></footer>

// ---------- helpers ----------
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mk=s=>String(s??'').replace(/\{(\d):([^}]*)\}/g,'<span class="c$1">$2</span>').replace(/~([^~]+)~/g,'<span class="strike">$1</span>');
const plain=s=>String(s??'').replace(/\{\d:([^}]*)\}/g,'$1').replace(/~([^~]+)~/g,'$1');
const noEmoji=s=>plain(s).replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\uFE0F\u200D\u20E3]/gu,'').replace(/\s+/g,' ').trim();
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-GB/i.test(v.lang)&&/female|Libby|Sonia|Kate|Serena|Google UK English Female/i.test(v.name))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,rate=.85){return new Promise(res=>{const t=noEmoji(text);if(!('speechSynthesis' in window)||!t){res();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=rate;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
let actx=null;
function tone(freqs,dur=.12,type='triangle'){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.8})}catch(e){}}
const chime=()=>tone([660,880,1320]), buzz=()=>tone([180,140],.22,'sawtooth'), gong=()=>tone([523,659,784,1047],.3);
const spk=(t,label)=>`<button class="say" data-say="${esc(plain(t))}"><span>${label??mk(t)}</span><span class="spk" aria-hidden="true">🔊</span></button>`;

let lesson=null,steps=[],cur={i:0};
function build(l){const s=[{type:'hello',name:'Hello at the door',min:2},{type:'date',name:'Date reporter',min:3}];
  if(l.warm)s.push(Object.assign({name:l.warm.title},l.warm));else if(l.flash)s.push({type:'flash',name:'Stand up / Sit down',min:5,items:l.flash});
  l.core.forEach(c=>s.push(Object.assign({name:c.title},c)));
  if(l.copy)s.push({type:'copy',name:'Copy it!',min:5,copy:l.copy});
  if(l.hp!==false)s.push({type:'hp',name:'Harry Potter',min:12});
  s.push({type:'exit',name:'Exit ticket',min:3,items:l.exit||[]});return s}
function colourMap(){const m={};(lesson?.core||[]).forEach(c=>{(c.boxes||[]).forEach(b=>{(b.text.match(/\{(\d):([^}]*)\}/g)||[]).forEach(x=>{const r=x.match(/\{(\d):([^}]*)\}/);m[r[2].replace(/\s*\+.*$/,'').trim().toLowerCase()]=r[1]})})});return m}

  if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);setTimer(steps[cur.i].min);render()}
function home(){lesson=null;steps=[];cur={i:0};if(location.hash)history.replaceState(null,'',location.pathname+location.search);setTimer(0);render()}

 ${LESSONS.indexOf(lesson)<LESSONS.length-1?`<button class="btn ghost" data-open="${LESSONS[LESSONS.indexOf(lesson)+1].id}" style="margin-left:auto">Next lesson →</button>`:''}</div>`};

// ---------- render ----------
const stage=document.getElementById('stage'),dots=document.getElementById('dots'),navBox=document.getElementById('navBox'),tBox=document.getElementById('timer');
function render(){
  if(!lesson){stage.innerHTML=R.home();document.getElementById('stepName').textContent='Chapter 1';document.getElementById('stepNum').textContent='Welcome back to school';navBox.hidden=true;tBox.hidden=true;return}
  navBox.hidden=false;tBox.hidden=false;const st=steps[cur.i];
  stage.innerHTML=`<section class="slide">${cur.i===0?'':''}${(R[st.type]||(()=>''))(st)}</section>`;
  document.getElementById('stepName').textContent=st.name;
  document.getElementById('stepNum').textContent=`P${lesson.part} · L${lesson.n} · ${cur.i+1}/${steps.length}`;
  dots.innerHTML=steps.map((x,i)=>`<button class="${i===cur.i?'on':''}" data-go="${i}" aria-label="${esc(x.name)}" title="${esc(x.name)}"></button>`).join('');
}
function go(i){if(!lesson)return;i=Math.max(0,Math.min(steps.length-1,i));const keep={reporter:cur.reporter};cur=Object.assign({i},keep);try{speechSynthesis.cancel()}catch(e){}setTimer(steps[i].min);render();stage.scrollTop=0}

// ---------- timer ----------
let left=0,tick=null;const tD=document.getElementById('tDisp'),tP=document.getElementById('tPlay');
const showT=()=>{tD.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`};
function setTimer(m){clearInterval(tick);tick=null;left=(m||0)*60;tBox.classList.remove('run','end');tP.textContent='▶';showT()}
function toggleT(){if(tick){clearInterval(tick);tick=null;tBox.classList.remove('run');tP.textContent='▶';return}
  if(left<=0)left=((steps[cur.i]||{}).min||1)*60;tBox.classList.add('run');tBox.classList.remove('end');tP.textContent='❚❚';
  tick=setInterval(()=>{left--;showT();if(left<=0){clearInterval(tick);tick=null;tBox.classList.remove('run');tBox.classList.add('end');tP.textContent='▶';gong()}},1000)}
tP.onclick=toggleT;document.getElementById('tReset').onclick=()=>setTimer((steps[cur.i]||{}).min);
document.getElementById('prev').onclick=()=>go(cur.i-1);document.getElementById('next').onclick=()=>go(cur.i+1);document.getElementById('homeBtn').onclick=home;
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(!lesson)return;if(e.key==='ArrowRight')go(cur.i+1);else if(e.key==='ArrowLeft')go(cur.i-1);else if(e.key==='t'||e.key==='T')toggleT()});

// ---------- actions ----------
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
async function runChant(st){for(let i=0;i<st.chant.length;i++){cur.chant=i;render();if(st.chant[i][1])tone([300],.08,'square');await say(st.chant[i][0],.8);await new Promise(r=>setTimeout(r,250))}cur.chant=-1;render()}
async function readAll(st){cur.stop=false;for(let i=0;i<st.items.length&&!cur.stop;i++){cur.hi=i;render();await say(st.items[i][0]);await new Promise(r=>setTimeout(r,350))}cur.hi=-1;render()}
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;if(!stage.contains(t)&&!dots.contains(t))return;
  const d=t.dataset,st=steps[cur.i];
  if(d.open){openLesson(d.open);return}
  if(d.go!==undefined){go(+d.go);return}
  if(d.say){say(d.say);return}
  if(d.sayTarget!==undefined){const v=S.hp.targets[+d.sayTarget];if(v)say(v);return}
  if(d.v!==undefined){const i=+d.v;cur.hi=i;cur.rev=i;render();say(st.items[i][0]);return}
  if(d.cell!==undefined){cur.open=+d.cell;cur.oshow=false;render();return}
  if(d.cat!==undefined){const ok=+d.cat===st.items[cur.k][1];cur.pick=+d.cat;if(ok){cur.score++;chime()}else buzz();render();say(st.items[cur.k][0]);return}
  if(d.chk!==undefined){cur.chk[d.chk]=!cur.chk[d.chk];render();return}
  if(d.phase!==undefined){cur.ph=+d.phase;setTimer([1,4,4,3][cur.ph]);render();return}
  if(d.word){cur.found[d.word][d.h]=(cur.found[d.word][d.h]||0)+1;addPoints(d.h,1);render();return}
  if(d.tfa!==undefined){const it=ensureTF(st);it[+d.tfa][1]=!it[+d.tfa][1];save('tf');render();return}
  if(d.tfdel!==undefined){const it=ensureTF(st);if(it.length>1){it.splice(+d.tfdel,1);cur.k=Math.min(cur.k||0,it.length-1);save('tf');render()}return}
  if(d.chv!==undefined){const x=S.charter[+d.chv];x.votes=Math.max(0,(x.votes||0)+(+d.d));if(+d.d>0)chime();save('charter');render();return}
  if(d.chdel!==undefined){S.charter.splice(+d.chdel,1);save('charter');render();return}
  const a=d.act;if(!a)return;
  const n=(st.items||[]).length||1;
  const A={
   kprev(){cur.k=((cur.k||0)-1+n)%n;cur.show=false},knext(){cur.k=((cur.k||0)+1)%n;cur.show=false;if(st.type==='flash')say(tfItems(st)[cur.k][0])},
   tfshow(){cur.show=true;tfItems(st)[cur.k||0][1]?chime():buzz()},tfedit(){cur.edit=!cur.edit},tfadd(){ensureTF(st).push(['New sentence.',true]);save('tf')},
   tfreset(){delete S.tf[lesson.id];cur.k=0;save('tf')},
   vread(){readAll(st);return 'nr'},vrand(){cur.hi=rnd(st.items.length,cur.hi);cur.rev=-1;tone([520],.1)},vhide(){cur.hide=!cur.hide;cur.rev=-1},
   ssay(){cur.mode='say';cur.k=rnd(st.items.length,cur.k);cur.show=false;cur.prefix=cur.ts?Math.random()<.7:false;const txt=(cur.prefix?'Teacher says: ':'')+st.items[cur.k][0];render();say(txt);return 'nr'},
   scard(){cur.mode='card';cur.k=rnd(st.items.length,cur.k);tone([520],.1)},sshow(){cur.show=true;if(cur.ts)(cur.prefix?chime:buzz)()},sts(){cur.ts=!cur.ts},
   qshow(){cur.show=true;chime();say(plain(st.items[cur.k||0][1]))},qpt(){addPoints(d.h==='A'?(cur.qA||'g'):(cur.qB||'s'),1);cur.k=((cur.k||0)+1)%n;cur.show=false},
   chant(){runChant(st);return 'nr'},
   slshow(){cur.show=true;chime();const[s,v,x]=st.items[cur.k||0];say(`${s} ${x} ${noEmoji(v)}`)},slsay(){const[s,v]=st.items[cur.k||0];say(`${s}… blank… ${noEmoji(v)}`);return 'nr'},
   tttshow(){cur.oshow=true;say(plain(st.items[cur.open][1]))},tttclose(){cur.open=-1},
   tttok(){chime();const m=cur.turn==='A'?'X':'O';cur.ttt[cur.open]=m;cur.open=-1;if(lines.some(l=>l.every(i=>cur.ttt[i]===m))){const k=cur.turn==='A'?cur.tA:cur.tB;cur.win=k;addPoints(k,3);gong()}else if(cur.ttt.every(Boolean))cur.win='draw';cur.turn=cur.turn==='A'?'B':'A'},
   tttno(){buzz();cur.open=-1;cur.turn=cur.turn==='A'?'B':'A'},tttreset(){cur.ttt=Array(9).fill('');cur.win=null;cur.open=-1;cur.turn='A'},
   sortnext(){cur.k++;cur.pick=null},sortreset(){cur.k=0;cur.score=0;cur.pick=null},
   vtl(){cur.hide=!cur.hide},
   chadd(){const i=document.getElementById('chNew');const v=i.value.trim();if(v){S.charter.push({text:v,votes:0});save('charter')}},chfinal(){cur.final=true;gong()},chback(){cur.final=false},
   nextscene(){S.hp.scene=Math.min(SCENES.length-1,S.hp.scene+1);S.hp.targets=['','',''];save('hp')},
   addword(){addWord()},
   exitnext(){const it=st.items.length||1;cur.k=rnd(it,cur.k);say(plain(st.items[cur.k]||''));},
   resetask(){cur.confirm=true},resetno(){cur.confirm=false},resetyes(){HOUSES.forEach(h=>S.houses[h.k]=0);cur.confirm=false;save('houses');renderHouses()}
  };
  if(A[a]){if(A[a]()!=='nr')render()}
});
function ensureTF(st){if(!S.tf[lesson.id])S.tf[lesson.id]=st.items.map(x=>[x[0],!!x[1]]);return S.tf[lesson.id]}
function addWord(){const i=document.getElementById('newWord');if(!i)return;const w=i.value.trim();if(!w)return;if(!S.book.some(x=>x.word.toLowerCase()===w.toLowerCase())){S.book.push({word:w,scene:SCENES[S.hp.scene][0]});save('book')}i.value='';render();setTimeout(()=>document.getElementById('newWord')?.focus(),0)}
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='tA'){cur.tA=t.value;render()}else if(t.id==='tB'){cur.tB=t.value;render()}
  else if(t.id==='qA'){cur.qA=t.value;render()}else if(t.id==='qB'){cur.qB=t.value;render()}
  else if(t.id==='scene'){S.hp.scene=+t.value;save('hp');render()}
  else if(t.id==='chTop'){cur.top=+t.value;render()}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.tfq!==undefined){ensureTF(steps[cur.i])[+t.dataset.tfq][0]=t.value;save('tf')}
  else if(t.dataset.target!==undefined){S.hp.targets[+t.dataset.target]=t.value;save('hp')}
  else if(t.id==='reporter')cur.reporter=t.value});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='newWord')addWord();else if(e.target.id==='chNew'){const v=e.target.value.trim();if(v){S.charter.push({text:v,votes:0});save('charter');render();setTimeout(()=>document.getElementById('chNew')?.focus(),0)}}});

// ---------- routing ----------
function route(){const h=location.hash.slice(1);if(h&&BYID[h]){if(!lesson||lesson.id!==h)openLesson(h)}else if(lesson&&!h)home()}
window.addEventListener('hashchange',route);
renderHouses();if(location.hash.slice(1)&&BYID[location.hash.slice(1)])openLesson(location.hash.slice(1));else render();
})();
</script>
